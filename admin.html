<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@prayag.nx Admin</title>
<style>body{margin:0;background:#090909;color:#eee;font-family:system-ui;padding:25px}main{max-width:520px;margin:auto}.card{background:#151515;padding:20px;border-radius:16px;margin-top:15px}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:9px;border:1px solid #444;background:#0b0b0b;color:#fff}button{padding:11px 16px;border:0;border-radius:9px;margin-top:8px;cursor:pointer}.hide{display:none}#status{margin-top:12px;color:#aaa}</style>
<main><h1>@prayag.nx</h1><section class="card" id="login"><h2>Private admin</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button id="loginBtn">Log in</button><div id="loginStatus"></div></section>
<section class="card hide" id="editor"><label>Main text</label><input id="title"><label>Text after YES</label><input id="subtitle"><label>Background image</label><input id="image" type="file" accept="image/*"><button id="save">Save changes</button><button id="logout">Log out</button><div id="status"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://xhmaxehcaedpbcpjrlfb.supabase.co","sb_publishable_E3NUqvDvXfuuuzGsO0I43A_RutwxcAk"),$=x=>document.getElementById(x);
async function load(){let r=await db.from("site_content").select("*").eq("id",1).single();if(r.error)throw r.error;$("title").value=r.data.title||"";$("subtitle").value=r.data.subtitle||""}
async function editor(){$("login").classList.add("hide");$("editor").classList.remove("hide");try{await load()}catch(e){$("status").textContent=e.message}}
$("loginBtn").onclick=async()=>{let r=await db.auth.signInWithPassword({email:$("email").value,password:$("pass").value});if(r.error){$("loginStatus").textContent=r.error.message;return}editor()};
$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};
$("save").onclick=async()=>{$("status").textContent="Saving...";try{let patch={title:$("title").value.trim(),subtitle:$("subtitle").value.trim()};let f=$("image").files[0];if(f){let ext=(f.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"");let path="background."+ext;let u=await db.storage.from("site-images").upload(path,f,{upsert:true,contentType:f.type,cacheControl:"3600"});if(u.error)throw u.error;patch.image_url=db.storage.from("site-images").getPublicUrl(path).data.publicUrl+"?v="+Date.now()}let r=await db.from("site_content").update(patch).eq("id",1);if(r.error)throw r.error;$("status").textContent="Saved ✓";$("image").value=""}catch(e){$("status").textContent="Save failed: "+e.message}};
db.auth.getSession().then(r=>{if(r.data.session)editor()});
</script>
