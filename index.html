<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@prayag.nx</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080808;color:#f4f0ea;font-family:system-ui,sans-serif}
body{display:grid;place-items:center;padding:18px}.page{width:min(100%,430px);min-height:calc(100vh - 36px);overflow:hidden;border-radius:28px;background:#151515}
.hero{position:relative;min-height:680px;display:flex;flex-direction:column;justify-content:space-between;padding:24px 18px 20px}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.72}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0005,transparent 35%,#000c)}
.top,.copy,.choice{position:relative;z-index:2}.handle{font-size:12px;letter-spacing:.14em;opacity:.75}
.copy{margin-top:auto;padding-bottom:24px}.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;opacity:.65;margin-bottom:12px}
h1{font:400 48px/.95 Georgia,serif;letter-spacing:-.04em;margin:0 0 18px;text-shadow:0 3px 25px #000}.sub{font-size:16px;line-height:1.45;max-width:300px;text-shadow:0 2px 15px #000}
.choice{display:flex;gap:9px;justify-content:center}button{min-width:100px;min-height:46px;border-radius:14px;border:1px solid #fff6;background:#0b0bcc;color:white;cursor:pointer;font-size:13px}.yes{background:#f0ebe3;color:#111;border-color:#f0ebe3}.single .yes{min-width:135px}
@media(max-width:420px){body{padding:0}.page{min-height:100vh;border-radius:0}.hero{min-height:100vh}}
</style>
<main class="page"><section class="hero"><img id="photo" class="photo" alt="Background"><div class="top"><div class="handle">@prayag.nx</div></div>
<div class="copy"><div class="eyebrow">be honest...</div><h1 id="title">Caught you looking.</h1><div class="sub" id="subtitle">Would you look again?</div></div>
<div class="choice" id="choice"><button class="yes" id="yes">yes</button><button id="no">no</button></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://xhmaxehcaedpbcpjrlfb.supabase.co","sb_publishable_E3NUqvDvXfuuuzGsO0I43A_RutwxcAk"),$=x=>document.getElementById(x);
let savedTitle="Caught you looking.", savedSubtitle="Would you look again?";
async function load(){
 const r=await db.from("site_content").select("title,subtitle,image_url").eq("id",1).single();
 if(r.data){
   savedTitle=r.data.title||savedTitle;
   savedSubtitle=r.data.subtitle||savedSubtitle;
   $("title").textContent=savedTitle;
   $("subtitle").textContent=savedSubtitle;
   if(r.data.image_url)$("photo").src=r.data.image_url;
 }
}
$("no").onclick=()=>{$("no").remove();$("choice").classList.add("single");$("title").textContent="You have no other choice";$("subtitle").textContent="❤️"};
$("yes").onclick=()=>{
  $("title").textContent=savedTitle;
  $("subtitle").textContent=savedSubtitle;
  $("choice").remove();
};
load();
</script>
